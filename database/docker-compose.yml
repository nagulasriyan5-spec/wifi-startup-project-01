services:
  mysql:
    image: mysql:8.4
    container_name: sriyan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sriyan
      MYSQL_USER: sriyan
      MYSQL_PASSWORD: sriyan
      MYSQL_ROOT_PASSWORD: sriyan_root
    ports:
      - "3307:3306"
    volumes:
      - sriyan-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sriyan-mysql-data:
