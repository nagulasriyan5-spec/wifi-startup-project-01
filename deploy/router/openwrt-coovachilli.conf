# OpenWrt CoovaChilli example for Sriyan through FreeRADIUS.
# Install: opkg update && opkg install coova-chilli freeradius3-utils
# Replace placeholders before placing this in /etc/config/chilli.

config chilli
  option enabled '1'
  option net '192.168.182.0/24'
  option dhcpif 'br-lan'
  option radiusserver1 'FREERADIUS_IP'
  option radiusserver2 'FREERADIUS_IP'
  option radiussecret 'RADIUS_SHARED_SECRET'
  option radiusauthport '1812'
  option radiusacctport '1813'
  option interval '60'
  option uamserver 'https://HTTPS_APP_DOMAIN/hotspot'
  option uamsecret 'CHANGE_THIS_UAM_SECRET'
  option uamallowed 'HTTPS_APP_DOMAIN,checkout.razorpay.com,sdk.cashfree.com,api.phonepe.com'
  option acctupdate '60'

# Validate from OpenWrt:
# radtest TICKET_CODE any FREERADIUS_IP 0 RADIUS_SHARED_SECRET
