# FreeRADIUS 3.x rlm_rest example for Sriyan.
# Replace HTTPS_API_BASE and ROUTER_INTEGRATION_SECRET before enabling.
# In production with ROUTER_REQUIRE_REQUEST_SIGNATURE=true, point connect_uri at
# sriyan-signing-proxy.mjs instead of the public API. The proxy adds HMAC
# headers that FreeRADIUS rlm_rest cannot easily compute by itself.
#
# Suggested flow:
# 1. Enable this rest module as `sriyan_rest`.
# 2. In `sites-enabled/default`, call it from `authorize {}` and `accounting {}`.
# 3. MikroTik/OpenWrt should use this FreeRADIUS server for auth/accounting.

connect_uri = "https://HTTPS_API_BASE/api/router"

authorize {
  uri = "${..connect_uri}/authorize"
  method = "post"
  body = "json"
  data = '{
    "username": "%{User-Name}",
    "code": "%{User-Name}",
    "callingStationId": "%{Calling-Station-Id}",
    "macAddress": "%{Calling-Station-Id}",
    "ipAddress": "%{Framed-IP-Address}"
  }'
  tls = ${..tls}
  headers {
    Authorization = "Bearer ROUTER_INTEGRATION_SECRET"
  }
}

accounting {
  uri = "${..connect_uri}/accounting"
  method = "post"
  body = "json"
  data = '{
    "Class": "%{Class}",
    "Acct-Status-Type": "%{Acct-Status-Type}",
    "Acct-Input-Octets": "%{Acct-Input-Octets}",
    "Acct-Output-Octets": "%{Acct-Output-Octets}",
    "Acct-Input-Gigawords": "%{Acct-Input-Gigawords}",
    "Acct-Output-Gigawords": "%{Acct-Output-Gigawords}"
  }'
  tls = ${..tls}
  headers {
    Authorization = "Bearer ROUTER_INTEGRATION_SECRET"
  }
}

tls {
  check_cert = yes
  check_cert_cn = yes
}

